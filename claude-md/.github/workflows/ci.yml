name: CI

# This is a docs-only repo (no runtime, no build). CI stays deliberately lean:
# markdown lint and a secrets scan, both advisory — they surface issues without
# gating merges (see CLAUDE.md § Git & GitHub).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Advisory: respect MD03x/MD04x warnings without blocking merges. Rule selection lives in
      # `.markdownlint.jsonc` at the repo root — it disables the rules that fight the repo's
      # deliberate conventions (long table rows, <angle-bracket> placeholders parsed as inline
      # HTML), so what this job reports is signal rather than ~500 intentional lines.
      - name: markdownlint
        continue-on-error: true
        run: npx --yes markdownlint-cli "**/*.md"

  secrets:
    name: Secrets scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      # Advisory: a docs repo shouldn't carry secrets, but nothing here is executable —
      # keep it non-blocking so it flags accidental leaks without gating docs merges.
      - name: Semgrep secrets scan
        continue-on-error: true
        run: semgrep scan --disable-version-check --metrics=off --config p/secrets
