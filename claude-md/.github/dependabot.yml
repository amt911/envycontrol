# This repo has no runtime and no package manager — the only thing with a version to keep
# current is the set of GitHub Actions pinned in `.github/workflows/ci.yml`. Stale action
# majors are how a lean CI quietly stops running (or starts failing on a deprecated runner),
# so keep exactly this one ecosystem and nothing more.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
