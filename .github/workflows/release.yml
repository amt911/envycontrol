name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The tag is the single source of the published version: the working copy is
      # stamped here instead of carrying a version bump commit. Nothing is pushed
      # back, so main keeps whatever VERSION it had.
      - name: Stamp the version from the tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^VERSION = .*/VERSION = '${VERSION}'/" envycontrol.py
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # sed reports success even when it matches nothing, so the stamp is verified
      # through the CLI itself. `--version` is an argparse action: no root, no
      # hardware probe and no system mutation.
      - name: Verify the CLI reports the tagged version
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          REPORTED="$(python3 envycontrol.py --version)"
          if [ "$REPORTED" != "$EXPECTED" ]; then
            echo "::error::CLI reports '${REPORTED}' but tag asks for '${EXPECTED}'."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
