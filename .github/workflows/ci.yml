name: CI

on:
  push:
    branches:
      - add-claude-md
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Run host-safe tests
        run: python -m pytest -v

      - name: Enforce branch coverage
        run: python -m pytest --cov=envycontrol --cov-branch --cov-report=term-missing

      - name: Ruff
        run: ruff check envycontrol.py tests scripts

      - name: Mypy
        run: mypy envycontrol.py

      - name: Pre-commit deterministic checks
        run: pre-commit run --all-files

      - name: Run safe PR verifier
        env:
          RUN_MUTATION: "0"
          RUN_SYSTEM_VM: "0"
        run: ./scripts/verify/verify-pr.sh
