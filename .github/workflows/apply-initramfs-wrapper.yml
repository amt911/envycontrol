name: Apply initramfs wrapper

on:
  push:
    branches:
      - feat/boot-rebuild-backends
    paths:
      - .github/workflows/apply-initramfs-wrapper.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/boot-rebuild-backends
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Replace legacy rebuild selector with compatibility wrapper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('envycontrol.py')
          text = path.read_text()
          start = text.index('def rebuild_initramfs():\n')
          end = text.index('\ndef create_file(', start)
          replacement = "\n".join([
              "def rebuild_initramfs():",
              "    plan = resolve_boot_rebuild_plan()",
              "    print('Rebuilding boot artifacts...')",
              "    plan.execute(",
              "        boot.SubprocessCommandRunner(),",
              "        verbose=logging.getLogger().level == logging.DEBUG,",
              "    )",
              "    print('Successfully rebuilt boot artifacts!')",
              "",
              "",
          ])
          text = text[:start] + replacement + text[end + 1:]
          path.write_text(text)

          tests = Path('tests/test_host_safety.py')
          content = tests.read_text()
          old = '    monkeypatch.setattr(envycontrol, "rebuild_initramfs", lambda: calls.append(("initramfs",)))\n\n    envycontrol.graphics_mode_switcher'
          new = "\n".join([
              "    class FakePlan:",
              "        def execute(self, runner, verbose=False):",
              "            calls.append((\"initramfs\",))",
              "",
              "    monkeypatch.setattr(envycontrol, \"resolve_boot_rebuild_plan\", lambda: FakePlan())",
              "",
              "    envycontrol.graphics_mode_switcher",
          ])
          assert old in content
          tests.write_text(content.replace(old, new, 1))
          PY
      - name: Install test dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: Verify GREEN
        run: python -m pytest tests/test_initramfs.py tests/test_host_safety.py tests/test_boot_preflight.py tests/test_modes.py -v
      - name: Commit wrapper and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-initramfs-wrapper.yml
          git add envycontrol.py tests/test_host_safety.py
          git commit -m 'refactor: delegate initramfs rebuild to boot plan'
          git push origin HEAD:feat/boot-rebuild-backends
