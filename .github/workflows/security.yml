name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install audit tool
        run: python -m pip install pip-audit
      - name: Audit declared development dependencies
        run: python -m pip_audit -r requirements-dev.txt

  sast:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Semgrep Python and secrets rules
        run: semgrep scan --config p/python --config p/secrets envycontrol.py scripts tests
