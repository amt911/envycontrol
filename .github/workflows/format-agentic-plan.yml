name: Format agentic plan

on:
  push:
    branches:
      - add-claude-md
    paths:
      - .github/workflows/format-agentic-plan.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: add-claude-md

      - name: Normalize MD032 spacing only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/superpowers/plans/2026-09-16-agentic-development-foundation.md")
          lines = path.read_text().splitlines()
          out = []

          for line in lines:
              if line == "**Files:**":
                  out.append(line)
                  if not out or out[-1] != "":
                      out.append("")
                  continue

              if line == "**Interfaces:**":
                  if out and out[-1] != "":
                      out.append("")
                  out.append(line)
                  out.append("")
                  continue

              if line.startswith("- [ ]") and out and out[-1].startswith("- "):
                  out.append("")

              out.append(line)

          path.write_text("\n".join(out) + "\n")
          PY

      - name: Prove only blank-line changes were made
        run: |
          git diff --word-diff=porcelain -- docs/superpowers/plans/2026-09-16-agentic-development-foundation.md \
            | grep -Ev '^(diff --git|index |--- |\+\+\+ |@@|~$|$)' \
            | grep -Eq '^[+-]$' || {
                echo "Unexpected non-whitespace plan change" >&2
                git diff -- docs/superpowers/plans/2026-09-16-agentic-development-foundation.md
                exit 1
              }

      - name: Commit normalized plan
        run: |
          if git diff --quiet -- docs/superpowers/plans/2026-09-16-agentic-development-foundation.md; then
            echo "Plan already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-16-agentic-development-foundation.md
          git commit -m "style: normalize agentic plan markdown"
          git push origin HEAD:add-claude-md
