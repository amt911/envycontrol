default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # graphify-out/ is regenerated by the graph tool on every commit and is not
      # written back in normalized form, so normalizing it here fights the generator.
      - id: trailing-whitespace
        exclude: ^graphify-out/
      - id: end-of-file-fixer
        exclude: ^graphify-out/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        files: ^(CLAUDE\.md|AGENTS\.md|docs/.*\.md)$

  - repo: local
    hooks:
      - id: ruff
        name: ruff correctness checks
        entry: ruff check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: agent-docs-shim
        name: CLAUDE.md only imports AGENTS.md
        entry: bash -c 'grep -qx "@AGENTS.md" CLAUDE.md && ! grep -q "^## " CLAUDE.md'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: safety-tests
        name: host and VM safety regression tests
        entry: python -m pytest -q tests/test_host_safety.py tests/test_vm_guard.py tests/test_verify_scripts.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: pre-push-quality
        name: full coverage and mutation quality gates
        entry: ./scripts/hooks/pre-push.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
